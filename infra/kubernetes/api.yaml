apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftops-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: driftops-api}
  template:
    metadata:
      labels: {app: driftops-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/chetan10510/driftops-ai:latest
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: driftops-api
spec:
  selector: {app: driftops-api}
  ports: [{port: 80, targetPort: 8080}]
